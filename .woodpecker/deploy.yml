depends_on:
  - build

clone:
  git:
    disable: true

when:
  - event: push
    branch: main
  - event: tag

steps:
  - name: clone
    image: alpine/git
    commands:
      - apk add --no-cache curl
      - git clone https://admin:9382bd0ae1d5fc1af2aee1d330f92c6b2aac0258@gitea.csceccloud.net:1443/admin/ocr-demo.git .
      - git checkout $CI_COMMIT_BRANCH 2>/dev/null || git checkout $CI_COMMIT_TAG 2>/dev/null || true

  - name: deploy
    image: docker:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_PASSWORD:
        from_secret: registry_password
      REGISTRY_URL: registry.cn-beijing.aliyuncs.com
      NAMESPACE: woodpeacker
    commands:
      - echo "$REGISTRY_PASSWORD" | docker login $REGISTRY_URL -u "$REGISTRY_USER" --password-stdin
      - docker compose -f docker-compose.prod.yml pull
      - docker compose -f docker-compose.prod.yml up -d
      - docker image prune -f
      - echo "等待服务启动..."
      - |
        for i in $(seq 1 12); do
          wget -qO- http://localhost:8501 && echo "✅ 部署成功" && exit 0
          sleep 5
        done
        echo "⚠️ 健康检查超时：docker logs ocr-demo" && exit 1
