clone:
  disable: true

when:
  - event: push
  - event: pull_request
    branch: main

steps:
  - name: clone
    image: alpine/git
    environment:
      GH_MIRROR: https://ghproxy.com/
    commands:
      - apk add --no-cache curl
      # 尝试直连 GitHub，失败则走镜像
      - git clone https://github.com/liuli01/ocr-demo.git . || git clone ${GH_MIRROR}https://github.com/liuli01/ocr-demo.git .
      - git checkout $CI_COMMIT_BRANCH || git checkout $CI_COMMIT_TAG || true

  - name: test
    image: python:3.12-slim
    environment:
      PYTHONUNBUFFERED: 1
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      PIP_TRUSTED_HOST: pypi.tuna.tsinghua.edu.cn
    commands:
      - apt-get update && apt-get install -y --no-install-recommends libgl1 libglib2.0-0 && rm -rf /var/lib/apt/lists/*
      - pip install --no-cache-dir -r requirements.txt
      - python -c "import streamlit; import openai; import PIL; import cv2; import numpy; print('All imports OK')"
