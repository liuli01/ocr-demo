clone:
  git:
    disable: true

when:
  - event: push
  - event: pull_request
    branch: main

steps:
  - name: clone
    image: alpine/git
    commands:
      - apk add --no-cache curl
      # 从 Gitea 克隆（国内网络，速度快）
      - git clone https://admin:9382bd0ae1d5fc1af2aee1d330f92c6b2aac0258@gitea.csceccloud.net:1443/admin/ocr-demo.git .
      - git checkout $CI_COMMIT_BRANCH 2>/dev/null || git checkout $CI_COMMIT_TAG 2>/dev/null || true

  - name: test
    image: python:3.12-slim
    environment:
      PYTHONUNBUFFERED: 1
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      PIP_TRUSTED_HOST: pypi.tuna.tsinghua.edu.cn
    commands:
      - apt-get update && apt-get install -y --no-install-recommends libgl1 libglib2.0-0 && rm -rf /var/lib/apt/lists/*
      - pip install --no-cache-dir -r requirements.txt
      - python -c "import streamlit; import openai; import PIL; import cv2; import numpy; print('All imports OK')"
