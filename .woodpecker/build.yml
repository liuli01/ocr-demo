depends_on:
  - test

when:
  - event: push
    branch: main
  - event: tag
    tag: v*

steps:
  - name: build-and-push
    image: docker:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 复用宿主机 docker 登录状态
      - $HOME/.docker/config.json:/root/.docker/config.json:ro
    environment:
      - REGISTRY_URL=registry.cn-beijing.aliyuncs.com
      - NAMESPACE=woodpeacker
      - DOCKER_BUILDKIT=1
    commands:
      # 构建镜像（复用宿主机 ACR 登录，无需 docker login）
      - docker build --cache-from $REGISTRY_URL/$NAMESPACE/ocr-demo:latest -t $REGISTRY_URL/$NAMESPACE/ocr-demo:latest .
      # 版本标签
      - if [ -n "$CI_COMMIT_TAG" ]; then
          docker tag $REGISTRY_URL/$NAMESPACE/ocr-demo:latest $REGISTRY_URL/$NAMESPACE/ocr-demo:$CI_COMMIT_TAG;
        fi
      # 推送
      - docker push $REGISTRY_URL/$NAMESPACE/ocr-demo --all-tags
