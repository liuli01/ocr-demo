depends_on:
  - test

when:
  - event: push
    branch: main
  - event: tag
    tag: v*

steps:
  - name: build-and-push
    image: docker:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - REGISTRY_USER
      - REGISTRY_PASSWORD
    environment:
      - REGISTRY_URL=registry.cn-beijing.aliyuncs.com
      - NAMESPACE=woodpeacker
      - DOCKER_BUILDKIT=1
    commands:
      # 登录阿里云 ACR（凭据来自 Woodpecker Secret）
      - echo "$REGISTRY_PASSWORD" | docker login $REGISTRY_URL -u "$REGISTRY_USER" --password-stdin
      # 构建镜像
      - docker build --cache-from $REGISTRY_URL/$NAMESPACE/ocr-demo:latest -t $REGISTRY_URL/$NAMESPACE/ocr-demo:latest .
      # 版本标签
      - if [ -n "$CI_COMMIT_TAG" ]; then
          docker tag $REGISTRY_URL/$NAMESPACE/ocr-demo:latest $REGISTRY_URL/$NAMESPACE/ocr-demo:$CI_COMMIT_TAG;
        fi
      # 推送
      - docker push $REGISTRY_URL/$NAMESPACE/ocr-demo --all-tags
